[project]
name = "previewforge-assistant"
version = "0.1.0"
description = "Read-only, evidence-backed diagnostics for synthetic PreviewForge environments"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "pydantic-settings==2.15.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
