name: Platform CI
on:
  pull_request:
    paths: ['scripts/**', 'tests/platform/**', 'charts/**', 'gitops/**', 'observability/**', 'terraform/**', 'reconciler/**', 'bootstrap/**', '.github/workflows/**', 'previewforge-demo/app/aws.py', 'previewforge-demo/app/floci_smoke.py', 'previewforge-demo/requirements*.lock', 'previewforge-demo/pyproject.toml', 'previewforge-demo/Dockerfile']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/platform/**', 'charts/**', 'gitops/**', 'observability/**', 'terraform/**', 'reconciler/**', 'bootstrap/**', '.github/workflows/**', 'previewforge-demo/app/aws.py', 'previewforge-demo/app/floci_smoke.py', 'previewforge-demo/requirements*.lock', 'previewforge-demo/pyproject.toml', 'previewforge-demo/Dockerfile']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline lifecycle and provenance regressions
        run: python3 -m unittest discover -s tests/platform -v
      - name: Python lint and formatting with locked dependencies
        run: |
          docker build --target test --tag previewforge-checks previewforge-demo
          docker run --rm -v "$PWD:/repo:ro" previewforge-checks ruff check --config /app/pyproject.toml --no-cache /repo/scripts /repo/reconciler /repo/tests/platform
          docker run --rm -v "$PWD:/repo:ro" previewforge-checks ruff format --check --config /app/pyproject.toml --no-cache /repo/scripts /repo/reconciler /repo/tests/platform
      - name: Terraform lifecycle against an isolated local Floci
        run: |
          FLOCI_IMAGE=$(python3 -c 'import json; print(json.load(open("bootstrap/milestone5-tools.lock.json"))["floci"])')
          docker run --detach --name previewforge-terraform-ci --publish 127.0.0.1:4566:4566 --env FLOCI_STORAGE_MODE=memory "$FLOCI_IMAGE"
          trap 'docker rm --force previewforge-terraform-ci' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4566/health >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host -v "$PWD:/repo:ro" previewforge-checks python /repo/scripts/check_resources.py
      - name: Check workflow syntax with checksum-verified Actionlint
        run: |
          curl --fail --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Validate monitoring chart, configuration and alert behavior
        run: |
          curl --fail --location --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          echo "c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/linux-amd64:$PATH"
          python3 scripts/monitoring.py check
          helm lint charts/ai-assistant --namespace previewforge-ai --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template assistant charts/ai-assistant --namespace previewforge-ai --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa >/dev/null
