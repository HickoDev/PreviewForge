apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-api}
  ports:
    - {name: http, port: 8000, targetPort: http}
