{{- if .Values.exports.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-worker}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-worker
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "demo.security" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "demo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, app.worker]
          env:
            {{- include "demo.environment" . | nindent 12 }}
          resources:
            {{- toYaml .Values.workerResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [python, -m, app.worker, health]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [python, -m, app.worker, health, --live]}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: db-password, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: db-password
          secret: {secretName: {{ .Values.database.existingSecret }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
{{- end }}
