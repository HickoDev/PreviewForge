environment: staging
image:
  # The local bootstrap supplies a loaded, immutable containerd digest.
  repository: docker.io/previewforge/demo
  digest: ""
  pullPolicy: Never
replicas: 1
preview:
  enabled: false
seed: false
imagePullSecrets: []
failureExercise:
  enabled: false
database:
  image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
  name: previewforge
  user: previewforge
  port: 5432
  existingSecret: staging-db
  storageClass: previewforge-retain
  storageSize: 1Gi
  retain: true
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
databaseResources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
