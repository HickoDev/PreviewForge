[project]
name = "previewforge-demo"
version = "0.1.0"
description = "Synthetic task API for the PreviewForge local deployment platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "prometheus-client==0.26.0",
  "boto3==1.43.91",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the isolated PostgreSQL test-db service"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
