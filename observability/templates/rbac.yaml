apiVersion: v1
kind: ServiceAccount
metadata: {name: previewforge-prometheus}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: previewforge-workload-metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: previewforge-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: previewforge-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: previewforge-prometheus}
subjects:
  - {kind: ServiceAccount, name: previewforge-prometheus, namespace: observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: previewforge-workload-metrics}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: previewforge-workload-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: previewforge-workload-metrics}
subjects:
  - {kind: ServiceAccount, name: previewforge-workload-metrics, namespace: observability}
