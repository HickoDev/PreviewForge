[server]
http_port = 3000
[auth.anonymous]
enabled = true
org_role = Viewer
[auth]
disable_login_form = true
[users]
allow_sign_up = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[news]
news_feed_enabled = false
[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/previewforge.json
