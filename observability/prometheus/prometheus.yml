global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 3s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: previewforge-api
    # Scrape pod IPs even when readiness fails; Service endpoints would hide DB failures.
    kubernetes_sd_configs:
      - role: pod
        selectors:
          - role: pod
            label: app=demo-api,app.kubernetes.io/part-of=previewforge
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: staging|preview-[1-9][0-9]{0,8}
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_number]
        regex: api;8000
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: previewforge_.*
        action: keep
    sample_limit: 5000
    body_size_limit: 2MB
  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics.observability.svc.cluster.local:8080]
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: staging|preview-[1-9][0-9]{0,8}
        action: keep
    sample_limit: 10000
  - job_name: argocd
    static_configs:
      - targets: [argocd-metrics.argocd.svc.cluster.local:8082]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: argocd_app_info|argocd_app_sync_total
        action: keep
      - source_labels: [name]
        regex: staging|preview-[1-9][0-9]{0,8}
        action: keep
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
