apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previewforge
  namespace: argocd
spec:
  sourceRepos: ["git://previewforge-m2-git.argocd.svc.cluster.local:9418/previewforge.git"]
  destinations:
    - namespace: staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: ResourceQuota}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: batch, kind: Job}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
  # Intentionally no cascading-deletion finalizer for persistent staging.
spec:
  project: previewforge
  source:
    repoURL: git://previewforge-m2-git.argocd.svc.cluster.local:9418/previewforge.git
    targetRevision: main
    path: charts/demo-app
    helm:
      releaseName: demo
      valueFiles: [../../gitops/staging/values.yaml, ../../gitops/staging/image.json]
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      refresh: true
      backoff: {duration: 5s, factor: 2, maxDuration: 30s}
