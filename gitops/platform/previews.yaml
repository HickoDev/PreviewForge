apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previewforge-previews
  namespace: argocd
spec:
  sourceRepos: ["git://previewforge-m2-git.argocd.svc.cluster.local:9418/previewforge.git"]
  destinations:
    - namespace: preview-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: ResourceQuota}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: batch, kind: Job}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previewforge-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - git:
        repoURL: git://previewforge-m2-git.argocd.svc.cluster.local:9418/previewforge.git
        revision: main
        requeueAfterSeconds: 15
        files:
          - path: gitops/previews/preview-*.json
  template:
    metadata:
      name: '{{.environment}}'
      labels:
        previewforge.io/owner: previewforge-m3
        previewforge.io/lifecycle: preview
        previewforge.io/environment: '{{.environment}}'
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: previewforge-previews
      source:
        repoURL: git://previewforge-m2-git.argocd.svc.cluster.local:9418/previewforge.git
        targetRevision: main
        path: charts/demo-app
        helm:
          releaseName: demo
          valueFiles: [../../gitops/preview-values.yaml]
          parameters:
            - {name: environment, value: '{{.environment}}'}
            - {name: image.repository, value: '{{.image.repository}}'}
            - {name: image.digest, value: '{{.image.digest}}'}
            - {name: image.pullPolicy, value: '{{.image.pullPolicy}}'}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.environment}}'
      syncPolicy:
        automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
        retry:
          limit: 3
          refresh: true
          backoff: {duration: 5s, factor: 2, maxDuration: 30s}
