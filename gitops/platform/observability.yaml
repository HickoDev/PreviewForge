apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: previewforge-observability, namespace: argocd}
spec:
  sourceRepos: [ssh://git@github.com/HickoDev/PreviewForge.git]
  destinations:
    - {namespace: observability, server: https://kubernetes.default.svc}
  clusterResourceWhitelist:
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: PersistentVolumeClaim}
    - {group: apps, kind: Deployment}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: observability, namespace: argocd}
spec:
  project: previewforge-observability
  source:
    repoURL: ssh://git@github.com/HickoDev/PreviewForge.git
    targetRevision: main
    path: observability
    helm: {releaseName: monitoring}
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 30s}
